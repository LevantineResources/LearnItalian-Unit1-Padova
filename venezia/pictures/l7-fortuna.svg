<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
<!-- Lesson 7, Scene 5 (l7-domani.md): the Fortuna on the slip, side on; the board puts the sail on the mast, the ropes on the cleats, the forcola on her side, the chart in Momi’s hands. Made by scripts/d4c-pictures.js. -->
