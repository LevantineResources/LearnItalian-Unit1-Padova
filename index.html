<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Piazza · Learn Italian</title>
<!-- The game's home screen (docs/features/home-screen.md): made by `node scripts/build.js game` into dist/game/index.html, beside the
     units' pages (dist/game/padova/, venezia/, roma/). Its script: game/home.js with engine/core/progress.js and the units' manifests. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Titillium+Web:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* The home screen (game/home.html): the intro posters' look (engine/styles.css .intro, .poster, .name-card): a cobalt night, the yellow Bodoni
   logo, parchment cards in ink with a yellow offset shadow. Phones: 390 × 844 upright (one column), 844 × 390 sideways (three short cards). */
:root{
  --cobalto:#1c3d8f; --notte:#0f2260; --giallo:#f4b928; --verde:#2e6a4e; --rosso:#c23b2a; --carta:#f3e9d4; --inchiostro:#17203f; --muted:#5b6283;
  --display:'Bodoni Moda', 'Bodoni 72', Didot, Georgia, serif; --body:'Titillium Web', 'Segoe UI', system-ui, sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body,*{overscroll-behavior-x:none}
html{background:var(--notte)}
body{margin:0;min-height:100vh;background:linear-gradient(180deg,var(--cobalto) 0,var(--notte) 900px) no-repeat var(--notte);color:var(--carta);font-family:var(--body);font-size:16px;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input{font-family:inherit}
:focus-visible{outline:3px solid var(--giallo);outline-offset:2px}
.hs{width:min(1120px,100%);margin:0 auto;padding:28px 24px 40px}
.hs-head{margin-bottom:22px}
.eyebrow{font-weight:700;font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--giallo);margin:0}
.hs-head h1{font-family:var(--display);font-style:italic;font-weight:900;font-size:clamp(64px,11vw,132px);line-height:.88;margin:4px 0 12px;color:var(--giallo);letter-spacing:-.02em}
.tagline{font-size:19px;max-width:40ch;margin:0;line-height:1.4}

/* the save files */
.hs-slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-bottom:26px}
.hs-slot{background:var(--carta);color:var(--inchiostro);border-radius:14px;padding:14px 16px 16px;box-shadow:6px 6px 0 rgba(244,185,40,.45);display:flex;flex-direction:column;gap:6px;min-width:0;border:2px solid transparent}
.hs-slot.sel{box-shadow:6px 6px 0 var(--giallo);border-color:var(--cobalto)}
.hs-slot.is-empty{background:#e9dfc8}
.hs-pick{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px;border-radius:8px}
.hs-pick:focus-visible{outline:3px solid var(--cobalto);outline-offset:3px}
.hs-k{font-weight:700;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--cobalto)}
.hs-pct{display:flex;align-items:center;gap:8px}
.hs-pct b{font-family:var(--display);font-weight:800;font-size:26px;line-height:1}
.hs-mini{width:64px;height:8px;border-radius:99px;background:rgba(23,32,63,.14);overflow:hidden;display:block}
.hs-mini i{display:block;height:100%;background:var(--verde)}
.hs-name{font-family:var(--display);font-style:italic;font-weight:800;font-size:30px;line-height:1.05;margin:2px 0 0;overflow-wrap:anywhere}
.hs-name.empty{color:var(--muted);font-weight:600}
.hs-where{margin:0;font-weight:600;line-height:1.3}
.hs-when{margin:0;font-size:14px;color:var(--muted)}
.hs-units{list-style:none;margin:4px 0 2px;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.hs-units li{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;padding:2px 9px;border-radius:99px;border:1.5px solid var(--cobalto);color:var(--cobalto)}
.hs-units li.locked{border-color:rgba(91,98,131,.5);color:var(--muted);background:rgba(23,32,63,.05)}
.ic{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hs-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:6px}
.btn{font:700 16px var(--body);min-height:44px;padding:8px 16px;border-radius:10px;border:2px solid var(--cobalto);background:#fffdf8;color:var(--cobalto);cursor:pointer;touch-action:manipulation}
.btn.primary{background:var(--cobalto);color:#fff}
.btn.quiet{border-color:transparent;background:transparent;color:var(--muted);font-weight:600}
.btn.danger{background:var(--rosso);border-color:var(--rosso);color:#fff}
.btn small{font-weight:600;opacity:.75}
.linkbtn{background:none;border:0;color:var(--cobalto);text-decoration:underline;font:600 14px var(--body);cursor:pointer;padding:6px 0;min-height:32px}
.hs-new{width:100%}
.hs-new label{font-weight:700}
.row{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.row input{flex:1;min-width:120px;font:600 18px var(--body);padding:7px 12px;border:2px solid var(--cobalto);border-radius:10px;background:#fffdf8;color:var(--inchiostro);min-height:44px}
.hs-confirm{width:100%;background:#fbeee9;border:2px solid var(--rosso);border-radius:10px;padding:8px 10px}
.hs-confirm p{margin:0}

/* the two test saves (a test-drive look: dashed, a tag "never counted") */
.hs-tests{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin:-8px 0 26px}
.hs-test{background:#f8f1df;border:2px dashed rgba(28,61,143,.55);box-shadow:6px 6px 0 rgba(244,185,40,.3)}
.hs-test.sel{border-style:solid}
.hs-test .hs-name{font-size:26px}
.hs-tag{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);border:1.5px solid rgba(91,98,131,.5);border-radius:99px;padding:2px 8px;white-space:nowrap}
.hs-pick-static{cursor:default}
.hs-world-units .btn{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;min-width:96px;flex:1 1 0}
.hs-world-units .btn small{font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.hs-drive-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:12px;align-items:start}
.hs-drive-u{border:2px solid var(--cobalto);border-radius:12px;padding:10px 12px;background:#fffdf8;min-width:0}
.hs-drive-u summary{display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer;min-height:44px;list-style:none}
.hs-drive-u summary::-webkit-details-marker{display:none}
.hs-drive-u summary::after{content:'▾';color:var(--cobalto);font-weight:700;margin-left:4px}
.hs-drive-u:not([open]) summary::after{content:'▸'}
.hs-drive-h{min-height:44px;display:flex;align-items:center}
.hs-drive-u h3{margin:0;font-family:var(--display);font-style:italic;font-weight:800;font-size:22px}
.hs-drive-u h3 small{display:block;font-family:var(--body);font-style:normal;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--cobalto);font-weight:700}
.hs-drive-u.empty .hs-note{margin:4px 0 2px}
.hs-drive-u summary h3{margin:0;font-family:var(--display);font-style:italic;font-weight:800;font-size:22px;flex:1}
.hs-drive-u summary h3 small{display:block;font-family:var(--body);font-style:normal;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--cobalto);font-weight:700}
.hs-drive-u h4{margin:10px 0 4px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--cobalto)}
.hs-drive-u ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.hs-drive-u .hs-r span{display:flex;flex-direction:column;min-width:0}
.hs-drive-u .hs-r span i{font-style:normal;font-size:13px;font-weight:600;color:var(--muted)}
.hs-r.off{opacity:.5;cursor:not-allowed;border-style:dashed}
.hs-r.off:hover{background:transparent}

/* the selected save */
.hs-panel{background:var(--carta);color:var(--inchiostro);border-radius:14px;padding:18px 20px 20px;box-shadow:6px 6px 0 var(--giallo)}
.hs-panel h2{font-family:var(--display);font-style:italic;font-weight:800;font-size:28px;margin:0 0 12px}
.hs-panel h2 small{font-family:var(--body);font-style:normal;font-weight:600;font-size:15px;color:var(--muted)}
.hs-bar{display:flex;gap:4px;height:34px;align-items:stretch}
.hs-bar .seg{position:relative;background:rgba(23,32,63,.12);border-radius:6px;overflow:hidden;min-width:0}
.hs-bar .seg i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--verde),#3f8a66)}
.hs-bar .seg span{position:relative;display:block;padding:0 8px;font-size:13px;font-weight:700;line-height:34px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--inchiostro);text-shadow:0 0 3px #f3e9d4,0 0 3px #f3e9d4}
.hs-bar .seg.tdrive{flex:0 0 auto;background:transparent;border:2px dashed rgba(91,98,131,.6)}
.hs-bar .seg.tdrive span{line-height:30px;color:var(--muted);text-shadow:none}
.hs-bar-note{margin:8px 0 0;font-size:15px}
.hs-go{margin:10px 0 0;padding:6px 10px;border-radius:8px;background:#fff4cf;border:2px solid var(--giallo)}
.hs-units-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:16px;align-items:start}
.hs-unit{border:2px solid var(--cobalto);border-radius:12px;padding:12px 14px;background:#fffdf8;display:flex;flex-direction:column;gap:6px;min-width:0}
.hs-unit.locked{border-color:rgba(91,98,131,.45);background:rgba(255,253,248,.55)}
.hs-unit.hl{box-shadow:0 0 0 4px var(--giallo)}
.hs-unit-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.hs-unit h3{margin:0;font-family:var(--display);font-style:italic;font-weight:800;font-size:24px}
.hs-unit h3 small{display:block;font-family:var(--body);font-style:normal;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--cobalto);font-weight:700}
.hs-count{font-weight:700;font-size:14px;color:var(--verde)}
.hs-blurb{margin:0;font-size:14px;line-height:1.4;color:#3b4366}
.hs-lock,.hs-note{margin:0;font-size:14px;font-weight:700;color:var(--muted);display:flex;gap:6px;align-items:center}
.hs-note{color:var(--cobalto)}
.hs-skip{border-top:1px dashed rgba(23,32,63,.3);margin-top:4px;padding-top:6px}
.hs-skip h4{margin:8px 0 4px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--cobalto)}
.hs-skip ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;max-height:280px;overflow-y:auto}
.hs-replay-note{margin:0;font-size:13px;color:var(--muted)}
.hs-r{width:100%;display:flex;gap:8px;align-items:baseline;text-align:left;font:600 15px var(--body);color:var(--inchiostro);background:transparent;border:1.5px solid rgba(28,61,143,.35);border-radius:8px;padding:8px 10px;min-height:40px;cursor:pointer}
.hs-r:hover{background:#fff4cf}
.hs-r b{color:var(--cobalto);min-width:2.2em}
.hs-r.node b{min-width:0;font-size:12px}
.hs-r.d3{padding-left:22px}.hs-r.d4{padding-left:34px}
.hs-r small{margin-left:auto;color:var(--muted);font-weight:600;white-space:nowrap}
.hs-foot{margin:18px 0 0;font-size:14px;opacity:.9}
.hs-foot a{color:var(--giallo)}
.dz{background:#b3261e;color:#fff;font-weight:700;font-size:12px;padding:3px 9px;border-radius:99px;margin-right:6px}

/* narrower screens */
@media (max-width:900px){ .hs-units-list,.hs-drive-list{grid-template-columns:1fr} }
@media (max-width:700px){
  .hs{padding:18px 14px 30px}
  .hs-slots{grid-template-columns:1fr;gap:14px}
  .hs-tests{grid-template-columns:1fr;gap:14px;margin-top:-4px}
  .tagline{font-size:17px}
  .hs-panel{padding:14px 14px 16px}
}
/* a phone held sideways (short): a compact head, the cards side by side but short */
@media (max-height:500px) and (min-width:701px){
  .hs{padding:12px 18px 24px}
  .hs-head{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:12px}
  .hs-head .eyebrow{display:none}
  .hs-head h1{font-size:50px;margin:0}
  .tagline{font-size:14px;flex:1 1 260px;max-width:none}
  .hs-when{font-size:13px}
  .hs-units li{font-size:12px;padding:1px 7px}
  .hs-slots{gap:12px;margin-bottom:16px}
  .hs-slot{padding:10px 12px 12px;gap:4px}
  .hs-name{font-size:24px}
  .hs-where{font-size:14px}
  .hs-units-list,.hs-drive-list{grid-template-columns:repeat(3,minmax(0,1fr))}
  .hs-tests{gap:12px;margin:-4px 0 16px}
  .hs-test .hs-name{font-size:22px}
}
@media (prefers-reduced-motion: reduce){ *{transition:none !important;animation:none !important} }
</style>
</head>
<body>
<main id="home" class="hs">
  <header class="hs-head">
    <p class="eyebrow">Learn Italian · Impara l'italiano</p>
    <h1>Piazza</h1>
    <p class="tagline">Three cities, one language. Talk your way from a small town's piazza to Venice and Rome.</p>
  </header>
  <section id="saves" class="hs-slots" aria-label="Save files"></section>
  <section id="tests" class="hs-tests" aria-label="Test saves: never counted"></section>
  <section id="detail" class="hs-detail" aria-live="polite"></section>
  <p class="hs-foot" id="foot"></p>
</main>
<script>
(() => {
'use strict';

/* How far a save is into a unit, from the save alone (the whole-game build's home screen: docs/features/home-screen.md). A pure
   function: no game state, only the unit's manifest (what the unit has: window.__gameManifest() in ui/home.js, written by
   `node scripts/build.js game`) and the save as stored (localStorage, JSON). The home screen (game/home.js) loads this very file
   (scripts/build.js inlines it into dist/game/index.html), so the page and the units count the same way; in a unit's bundle it is
   only used by window.__progressCheck() (ui/home.js: the pure count beside the game's own lessonCompleted / treeState, for the tests).

   The manifest: { unit, unitNo, saveKey, finishedBy:<rule> | null, lessons:[{ n, title, done:[tut] }], quests:[{ id, n, title }],
     nodes:[{ id, title, parent, depth, district, lesson, quest, continues, lessonNo, soon }], districts:[ids], side:[{ id, title, done:<rule>, soon }] }.
   A rule (side stories, finishedBy): { path:'a.b.c', eq? } (truthy, or equal), { lesson:n } (completed), { lessonAtLeast:n } (reached),
     { any:[rules] }, { all:[rules] }.
   What counts (one each: the weight): every lesson, every quest, every tree node that is not a lesson's or a quest's own node and not a
   "coming soon" stub (a node or a side story with soon: Venezia's District 3 frame, its closing scene of District 2), every side story. A unit never opened
   (no save) counts 0. */
const PROGRESS = (() => {
  /* the save that counts: a unit's own replay keeps the real one aside (Padova's S.replay.home, lessons/15-venezia/unit.js) */
  const real = S0 => { if (!S0 || typeof S0 !== 'object') return null;
    if (S0.replay && typeof S0.replay.home === 'string') try { const h = JSON.parse(S0.replay.home); if (h && typeof h === 'object') return h; } catch (e){}
    return S0; };
  const at = (o, path) => String(path).split('.').reduce((a, k) => a == null ? undefined : a[k], o);
  function lessonDone(M, S, n){
    const L = M.lessons.find(l => l.n === n); if (!L || !S) return false;
    const cur = +S.lesson || 1;
    return cur > n || (cur === n && (L.done || []).includes(S.tut));
  }
  const questDone = (S, id) => !!(S && S.quests && S.quests[id] && S.quests[id].done);
  function rule(M, S, r){
    if (!r || !S) return false;
    if (r.any) return r.any.some(x => rule(M, S, x));
    if (r.all) return r.all.every(x => rule(M, S, x));
    if (r.lesson) return lessonDone(M, S, r.lesson);
    if (r.lessonAtLeast) return (+S.lesson || 1) >= r.lessonAtLeast;
    if (r.path){ const v = at(S, r.path); return 'eq' in r ? v === r.eq : !!v; }
    return false;
  }
  const node = (M, id) => M.nodes.find(n => n.id === id) || null;
  function nodeDone(M, S, n){
    if (!n || !S) return false;
    return !!(S.tree && S.tree.done && S.tree.done[n.id]) || (!!n.lesson && lessonDone(M, S, n.lesson)) || (!!n.quest && questDone(S, n.quest));
  }
  /* the Albero's gate (core/tree.js treeGate): levels 1–2 of a district done; the next district opens with it */
  function districtOpen(M, S, d, open){
    if (open) return true;
    const i = M.districts.indexOf(d); if (i <= 0) return i === 0;
    const ns = M.nodes.filter(n => n.district === M.districts[i - 1] && n.depth <= 2);
    return ns.length > 0 && ns.every(n => nodeDone(M, S, n));
  }
  /* open or done (core/tree.js treeState); o.open: designer mode (every district and core node open; a node still waits for its parent) */
  function nodeReached(M, S, n, o = {}){
    if (!S || !n) return false;
    if (nodeDone(M, S, n)) return true;
    if (n.parent){ if (!nodeDone(M, S, node(M, n.parent))) return false; }
    else if (!districtOpen(M, S, n.district, o.open)) return false;
    if (n.continues && !nodeDone(M, S, node(M, n.continues))) return false;
    if (!o.open && n.lesson && (+S.lesson || 1) < n.lesson) return false;
    return true;
  }
  /* every item that counts: [{ kind:'lesson' | 'quest' | 'node' | 'side', id, title }] */
  function items(M){
    return [
      ...M.lessons.map(l => ({ kind:'lesson', id:'l' + l.n, n:l.n, title:l.title })),
      ...M.quests.map(q => ({ kind:'quest', id:'q:' + q.id, qid:q.id, title:q.title })),
      ...M.nodes.filter(n => !n.lesson && !n.quest && !n.soon).map(n => ({ kind:'node', id:'t:' + n.id, nid:n.id, title:n.title })),
      ...(M.side || []).filter(s => !s.soon).map(s => ({ kind:'side', id:'s:' + s.id, sid:s.id, title:s.title })),
    ];
  }
  function isDone(M, S, it){
    if (it.kind === 'lesson') return lessonDone(M, S, it.n);
    if (it.kind === 'quest') return questDone(S, it.qid);
    if (it.kind === 'node') return nodeDone(M, S, node(M, it.nid));
    if (it.kind === 'side') return rule(M, S, (M.side.find(s => s.id === it.sid) || {}).done);
    return false;
  }
  /* a unit's count from its stored save: { done, total, pct, ids (done), finished } */
  function unit(M, S0){
    const S = real(S0), all = items(M), ids = S ? all.filter(it => isDone(M, S, it)).map(it => it.id) : [];
    const total = all.length, done = ids.length;
    const finished = !!S && (M.finishedBy ? rule(M, S, M.finishedBy) : total > 0 && done === total);
    return { done, total, pct:total ? Math.round(100 * done / total) : 0, ids, finished };
  }
  /* the whole game: every unit's count added up (one item, one weight) */
  function game(Ms, saves){
    const per = Ms.map(M => ({ unit:M.unit, ...unit(M, saves[M.unit]) }));
    const done = per.reduce((a, u) => a + u.done, 0), total = per.reduce((a, u) => a + u.total, 0);
    return { done, total, pct:total ? Math.floor(100 * done / total) : 0, units:per };
  }
  /* where a save is: { lesson, title, done (that lesson completed) } */
  function where(M, S0){
    const S = real(S0); if (!S) return null;
    const n = +S.lesson || 1, L = M.lessons.find(l => l.n === n);
    return { lesson:L ? n : null, title:L ? L.title : '', done:L ? lessonDone(M, S, n) : false, tut:S.tut || '' };
  }
  /* what a save can skip to (the home screen's replays): its lessons completed or current, its tree's nodes open or done, in order */
  function reached(M, S0, o = {}){
    const S = real(S0); if (!S && !o.open) return [];
    const cur = S ? +S.lesson || 1 : 0;
    return [
      ...M.lessons.filter(l => o.open || l.n <= cur).map(l => ({ kind:'lesson', n:l.n, title:l.title, done:lessonDone(M, S, l.n) })),
      ...M.nodes.filter(n => !n.lesson && !n.quest && !n.soon && (S ? nodeReached(M, S, n, o) : !n.parent))
        .map(n => ({ kind:'node', id:n.id, title:n.title, depth:n.depth, district:n.district, done:nodeDone(M, S, n) })),
    ];
  }
  return { unit, game, items, where, reached, real, rule, lessonDone, nodeDone, nodeReached };
})();
if (typeof module === 'object' && module && module.exports) module.exports = PROGRESS;      // (Node: the tests, scripts/build.js)

/* The home screen (docs/features/home-screen.md): three save files, each one's completion and where it is, the progress bar of the one
   selected, the units (open or locked) and, for each, Skip to… (a replay of a lesson or an Albero node the save has reached).
   It reads the saves straight from localStorage (the units' pages are on the same origin: dist/game/<unit>/) and counts them with
   engine/core/progress.js (PROGRESS) against the units' manifests (MANIFESTS: what each unit has, written by scripts/build.js game).
   The slots' keys are the units' (engine core/slots.js): slot 1 = each unit's own key (Padova's piazza-lezione-1), slot n = key + ':s<n>'.
   A unit is opened at <unit>/index.html?slot=n (&name=… for a new game; &replay=1 for a replay, its request in piazza-game-replay), and the
   home screen also leaves a small key (piazza-game-open) in case the address loses its query. Tests: tests/game/*.js; window.__home().
   Two test saves below the save files (docs/features/home-screen.md, "Two test saves"), on keys of their own (a unit's key + ':drive' / ':world':
   never a slot's, so never in the progress bar): the Lesson test drive (any lesson, quest, Albero node or side story of any unit, picked from the
   list, set up in the unit with everything before it done: <unit>/index.html?mode=drive, the pick in piazza-game-drive; every unit's ':drive'
   key wiped at each pick) and the Open world (?mode=world: every unit and area open, free play; kept between visits; Reset wipes them). */
const SLOTS = [1, 2, 3], HANDOFF = 'piazza-game-open', META = 'piazza-game-meta', REPLAY = 'piazza-game-replay', DKEY = 'learn-italian-designer', DRIVE = 'piazza-game-drive';
const TESTS = ['drive', 'world'];
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const ls = { get(k){ try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e){ return null; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch (e){} }, del(k){ try { localStorage.removeItem(k); } catch (e){} } };
const keyOf = (M, n) => n === 1 ? M.saveKey : M.saveKey + ':s' + n;
const modeKey = (M, mode) => M.saveKey + ':' + mode;                 // (the test saves' keys: engine core/slots.js slotBase)
const loadSave = k => { const d = ls.get(k); return d && d.v === 1 && d.playerName ? d : null; };
const unitOf = id => MANIFESTS.find(M => M.unit === id) || null;
const sanitizeName = s => { const w = String(s || '').trim().split(/\s+/)[0] || '', c = w.replace(/[^\p{L}'-]/gu, '').slice(0, 14);
  return c ? c.charAt(0).toUpperCase() + c.slice(1).toLowerCase() : ''; };

/* ---------- the page's own state ---------- */
const Q = new URLSearchParams(location.search);
if (Q.get('designer') === '1') ls.set(DKEY, { allowed:true, on:true });      // (designer mode: as a unit's ?designer=1, the same key)
if (Q.get('designer') === '0') ls.del(DKEY);
const designerOn = () => { const d = ls.get(DKEY); return !!(d && d.allowed && d.on); };
const H = { sel:TESTS.includes(Q.get('test')) ? Q.get('test') : +Q.get('slot') || 0, go:Q.get('go') || null, naming:null, confirm:null, skip:{}, nav:null, dopen:{}, reset:0 };
/* a replay is thrown away when its player comes home (a unit's ⌂ does it too: engine ui/home.js gameHome) */
SLOTS.forEach(n => MANIFESTS.forEach(M => ls.del(keyOf(M, n) + ':replay'))); ls.del(REPLAY);

/* ---------- a slot: its saves, its count, where it is ---------- */
function slot(n){
  const saves = {}; MANIFESTS.forEach(M => { saves[M.unit] = loadSave(keyOf(M, n)); });
  const meta = (ls.get(META) || {})[n] || null, has = MANIFESTS.filter(M => saves[M.unit]);
  const g = PROGRESS.game(MANIFESTS, saves);
  const d = designerOn(), open = {};
  /* a unit opens when the one before it is finished (Padova: Lesson 15 done; the others: everything they have done); one with a save in this
     slot stays open (no progress is ever locked away); designer mode opens all */
  MANIFESTS.forEach((M, i) => { open[M.unit] = d || i === 0 || !!saves[M.unit] || !!(g.units[i - 1] && g.units[i - 1].finished); });
  if (!has.length) return { n, empty:true, saves, meta, g, open };
  const cur = (meta && saves[meta.unit] && unitOf(meta.unit)) || has[has.length - 1], S = PROGRESS.real(saves[cur.unit]);
  const name = (S && S.playerName) || has.map(M => saves[M.unit].playerName).find(Boolean) || '';
  return { n, empty:false, saves, meta, g, open, cur, name, where:PROGRESS.where(cur, saves[cur.unit]) };
}
const slotName = n => (slot(n).name || '');
function whereText(s){
  if (s.empty) return '';
  const M = s.cur, w = s.where;
  if (!w || !w.lesson) return `${M.name}${M.note ? ' · test drive' : ''}`;
  const last = M.lessons.length;
  return `${M.name} · Lezione ${w.lesson} · ${w.title}` + (w.done ? (w.lesson === last ? ' · completed' : ' · done') : '');
}
const when = t => t ? new Date(t).toLocaleString('en-GB', { day:'numeric', month:'short', ...(new Date(t).getFullYear() !== new Date().getFullYear() ? { year:'numeric' } : {}), hour:'2-digit', minute:'2-digit' }) : '';
const lockSVG = '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
const openSVG = '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l4 4 10-10"/></svg>';
function lockedWhy(i){
  const P = MANIFESTS[i - 1]; if (!P) return '';
  return P.finishedBy && P.finishedBy.lesson ? `Opens when ${P.name} is finished (Lezione ${P.finishedBy.lesson})` : `Opens when ${P.name} is finished (everything in it done)`;
}

    <div class="hs-bar" role="progressbar" aria-label="How far into the whole game" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${g.pct}">${segs}</div>
    <p class="hs-bar-note"><b>${g.pct}%</b> of the game: ${g.done} of ${g.total} (every lesson, quest, Albero node and side story built so far counts one).</p>
    ${H.go && s.open[H.go] ? `<p class="hs-go" role="status"><b>${esc(unitOf(H.go).name)}</b> is open in this save file.</p>` : ''}
    <div class="hs-units-list">${rows}</div></div>`;
}

/* ---------- the two test saves ---------- */
const driveUnits = () => MANIFESTS.filter(M => M.drive);              // (a release build: none, and no Lesson test drive card)
const driveLast = () => { const D = ls.get(DRIVE); return D && unitOf(D.unit) && ls.get(modeKey(unitOf(D.unit), 'drive')) ? D : null; };
const worldSaved = M => !!loadSave(modeKey(M, 'world'));
/* a name for the test saves: the last played save file's, else Alex */
function testName(){
  const m = ls.get(META) || {}, by = SLOTS.filter(n => m[n] && m[n].at).sort((a, b) => m[b].at - m[a].at);
  return [...by, ...SLOTS].map(slotName).find(Boolean) || 'Alex';
}
/* everything a unit offers the Lesson test drive, in order: [{ kind, key, label, title, sub, depth, off, group }] */
function driveItems(M){
  const out = [];
  M.lessons.forEach(l => out.push({ group:'Lessons', kind:'lesson', key:String(l.n), label:'L' + l.n, title:l.title }));
  /* a core node that will be a lesson not built yet (lessonNo: Venezia's Lesson 6, District 3's core): with the lessons, greyed */
  M.nodes.filter(n => n.lessonNo && !n.lesson && !M.lessons.some(l => l.n === n.lessonNo)).sort((a, b) => a.lessonNo - b.lessonNo)
    .forEach(n => out.push({ group:'Lessons', kind:'lesson', key:String(n.lessonNo), label:'L' + n.lessonNo, title:n.title, off:'coming soon' }));
  M.quests.forEach(q => out.push({ group:'Quests', kind:'quest', key:q.id, label:'Q' + q.n, title:q.title }));
  M.districts.forEach((d, i) => M.nodes.filter(n => n.district === d && !n.lesson && !n.quest && !n.lessonNo)
    .forEach(n => out.push({ group:`The Albero · District ${i + 1}`, kind:'node', key:n.id, label:'◆', title:n.title, depth:n.depth, off:n.soon ? 'coming soon' : !M.replayNodes ? 'not in this build' : '' })));
  (M.side || []).forEach(x => out.push({ group:'Side stories', kind:'side', key:x.id, label:'★', title:x.title, sub:x.en, off:x.drive && !x.soon ? '' : 'coming soon' }));
  return out;
}
function testCards(){
  const D = driveLast(), DU = D && unitOf(D.unit), C = H.reset;
  const drive = !driveUnits().length ? '' : `<article class="hs-slot hs-test drive${H.sel === 'drive' ? ' sel' : ''}" data-test="drive">
    <button class="hs-pick" type="button" data-pick="drive" aria-pressed="${H.sel === 'drive'}"><span class="hs-k">Test save</span><span class="hs-tag">never counted</span></button>
    <h2 class="hs-name">Lesson test drive</h2>
    <p class="hs-where">Any lesson, quest, node of the Albero or side story of any unit, set up with everything before it done.</p>
    <p class="hs-when">${D ? `Last: ${esc(DU.name)} · ${esc(D.label || '')} ${esc(D.title || '')}` : 'Its own save: each pick starts afresh.'}</p>
    <div class="hs-actions"><button class="btn primary" type="button" data-act="choose">${H.sel === 'drive' ? 'Choose below' : 'Choose…'}</button>${D ? `<button class="btn" type="button" data-act="drive-continue">Continue</button>` : ''}</div></article>`;
  const units = MANIFESTS.map(M => `<button class="btn hs-world-u" type="button" data-world="${M.unit}"><span>${esc(M.name)}</span><small>${worldSaved(M) ? 'continue' : 'new'}</small></button>`).join('');
  const any = MANIFESTS.some(worldSaved);
  const reset = C ? `<div class="hs-confirm" role="alert"><p>Reset the open world? Every unit's starts afresh (your save files aren't touched).</p><div class="row"><button class="btn danger" type="button" data-act="reset2">Reset</button><button class="btn" type="button" data-act="cancel">Keep it</button></div></div>`
    : any ? `<button class="btn quiet" type="button" data-act="reset">Reset</button>` : '';
  const world = `<article class="hs-slot hs-test world" data-test="world">
    <div class="hs-pick hs-pick-static"><span class="hs-k">Test save</span><span class="hs-tag">never counted</span></div>
    <h2 class="hs-name">Open world</h2>
    <p class="hs-where">Every unit and every area open, free play: Padova's whole town, every district of Venice and of Rome.</p>
    <p class="hs-when">${any ? 'Kept between visits.' : 'Its own save, kept between visits.'}</p>
    <div class="hs-actions hs-world-units">${units}</div>${reset ? `<div class="hs-actions">${reset}</div>` : ''}</article>`;
  return drive + world;
}
function drivePanel(){
  const Ms = driveUnits(); if (!Ms.length) return '';
  const D = driveLast(), first = (D && D.unit) || Ms[0].unit;
  const blocks = Ms.map(M => {
    const its = driveItems(M), open = H.dopen[M.unit] !== undefined ? H.dopen[M.unit] : innerWidth > 900 || M.unit === first;      // (a phone: the last picked unit's list open, the others folded)
    if (!its.length) return `<div class="hs-drive-u empty" data-unit="${M.unit}"><div class="hs-drive-h"><h3><small>Unità ${M.unitNo}</small> ${esc(M.name)}</h3></div>
      <p class="hs-note">No lessons yet: walk the city in the Open world.</p></div>`;
    const groups = [...new Set(its.map(x => x.group))].map(g => `<h4>${esc(g)}</h4><ul>${its.filter(x => x.group === g).map(x =>
      `<li><button class="hs-r${x.kind === 'node' ? ' node d' + x.depth : ''}${x.off ? ' off' : ''}" type="button" ${x.off ? 'disabled aria-disabled="true"' : ''} data-drive="${M.unit}|${x.kind}|${esc(x.key)}"><b>${esc(x.label)}</b> <span>${esc(x.title)}${x.sub ? `<i>${esc(x.sub)}</i>` : ''}</span><small>${esc(x.off)}</small></button></li>`).join('')}</ul>`).join('');
    return `<details class="hs-drive-u" data-unit="${M.unit}"${open ? ' open' : ''}><summary><h3><small>Unità ${M.unitNo}</small> ${esc(M.name)}</h3><span class="hs-count">${its.filter(x => !x.off).length}</span></summary>
      ${groups}</details>`;
  }).join('');
  return `<div class="hs-panel hs-drive"><h2>Lesson test drive <small>· pick one to try</small></h2>
    <p class="hs-replay-note">Set up as designer mode's <i>Mark as complete</i> does it: everything before it done. It runs apart from your save files, isn't counted in any progress bar, and each pick starts afresh.</p>
    <div class="hs-drive-list">${blocks}</div></div>`;
}
function drivePick(unit, kind, key){
  const M = unitOf(unit); if (!M) return;
  const it = driveItems(M).find(x => x.kind === kind && x.key === key); if (!it || it.off) return;
  MANIFESTS.forEach(U => ls.del(modeKey(U, 'drive')));
  ls.set(DRIVE, { unit, kind, n:kind === 'lesson' ? +key : undefined, id:kind === 'lesson' ? undefined : key, label:it.label, title:it.title, name:testName(), fresh:true, at:Date.now() });
  go(unit, 0, { mode:'drive' });
}
function worldReset(){ MANIFESTS.forEach(M => ls.del(modeKey(M, 'world'))); }

function render(){
  $('#saves').innerHTML = SLOTS.map(slotCard).join('');
  $('#tests').innerHTML = testCards();
  $('#detail').innerHTML = detail();
  $('#foot').innerHTML = designerOn() ? '<span class="dz">Designer mode</span> every unit open (<a href="?designer=0">turn it off</a>)' : '';
  if (H.naming){ const i = $('#hsName' + H.naming); if (i) i.focus(); }
}

/* ---------- going into a unit ---------- */
function go(unit, n, extra = {}){
  const q = extra.mode ? [`mode=${extra.mode}`] : [`slot=${n}`]; if (extra.name) q.push('name=' + encodeURIComponent(extra.name)); if (extra.replay) q.push('replay=1');
  const url = `${unit}/index.html?${q.join('&')}`;
  ls.set(HANDOFF, { slot:n, unit, mode:extra.mode || null, name:extra.name || '', replay:!!extra.replay, at:Date.now() });
  H.nav = url; window.__homeNav = url;
  if (!window.__homeNoNav) location.href = url;
}
function openUnit(unit, n){ const s = slot(n); if (!s.open[unit]) return; go(unit, n, s.saves[unit] ? {} : { name:s.name || 'Alex' }); }
function replay(unit, n, kind, what){
  const s = slot(n); if (!s.open[unit]) return;
  ls.set(REPLAY, { slot:n, unit, kind, n:kind === 'lesson' ? +what : undefined, id:kind === 'node' ? what : undefined, name:s.name || 'Alex', fresh:true, at:Date.now() });
  go(unit, n, { replay:true });
}
function del(n){
  MANIFESTS.forEach(M => { ls.del(keyOf(M, n)); ls.del(keyOf(M, n) + ':replay'); });
  const m = ls.get(META) || {}; delete m[n]; ls.set(META, m);
}

document.addEventListener('click', e => {
  const t = e.target.closest('button, a'); if (!t) return;
  const n = +t.dataset.n || 0;
  if (t.dataset.pick){ H.sel = TESTS.includes(t.dataset.pick) ? t.dataset.pick : +t.dataset.pick; H.confirm = null; H.reset = 0; render();
    /* one column (a phone upright): the selected save's units are below the cards, so show where they start */
    const d = $('#detail'); if (innerWidth <= 700 && d && d.getBoundingClientRect().top > innerHeight && d.scrollIntoView) d.scrollIntoView({ block:'start', behavior:'smooth' });
    return; }
  const a = t.dataset.act;
  if (a === 'new'){ H.naming = n; H.sel = n; H.confirm = null; render(); return; }
  if (a === 'cancel'){ H.naming = null; H.confirm = null; H.reset = 0; render(); return; }
  if (a === 'choose'){ H.sel = 'drive'; H.confirm = null; render(); const d = $('#detail'); if (d && d.scrollIntoView) d.scrollIntoView({ block:'start', behavior:'smooth' }); return; }
  if (a === 'drive-continue'){ const D = driveLast(); if (D) go(D.unit, 0, { mode:'drive' }); return; }
  if (a === 'reset'){ H.reset = 1; render(); return; }
  if (a === 'reset2'){ worldReset(); H.reset = 0; render(); return; }
  if (t.dataset.world){ go(t.dataset.world, 0, { mode:'world', name:testName() }); return; }
  if (t.dataset.drive){ const [u, k, w] = t.dataset.drive.split('|'); drivePick(u, k, w); return; }
  if (a === 'continue'){ const s = slot(n); if (!s.empty) go(s.cur.unit, n); return; }
  if (a === 'delete'){ H.confirm = { n, step:1 }; H.sel = n; render(); return; }
  if (a === 'del1'){ H.confirm = { n, step:2 }; render(); return; }
  if (a === 'del2'){ del(n); H.confirm = null; render(); return; }
  if (t.closest('summary')) return;
  if (t.dataset.open){ openUnit(t.dataset.open, H.sel); return; }
  if (t.dataset.skip){ H.skip[t.dataset.skip] = !H.skip[t.dataset.skip]; render(); return; }
  if (t.dataset.replay){ const [u, k, w] = t.dataset.replay.split('|'); replay(u, H.sel, k, w); return; }
});
document.addEventListener('submit', e => {
  const f = e.target.closest('[data-new]'); if (!f) return; e.preventDefault();
  const n = +f.dataset.new, name = sanitizeName(f.querySelector('input').value) || 'Alex';
  H.naming = null; del(n); go(MANIFESTS[0].unit, n, { name });
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && (H.naming || H.confirm || H.reset)){ H.naming = null; H.confirm = null; H.reset = 0; render(); } });
document.addEventListener('toggle', e => { const d = e.target; if (d.matches && d.matches('details.hs-drive-u')) H.dopen[d.dataset.unit] = d.open; }, true);

/* the selected save: the one asked for (?slot=), else the last played, else the first with a save, else 1 */
/* back from a test save (a unit's ⌂: ?test=drive | world): the drive's picker selected; the open world has no panel, so the save last played is */
const backFrom = TESTS.includes(H.sel) ? H.sel : null;
if (H.sel === 'world' || (H.sel === 'drive' && !driveUnits().length)) H.sel = 0;
if (!SLOTS.includes(H.sel) && !TESTS.includes(H.sel)){
  const m = ls.get(META) || {}, by = SLOTS.filter(n => m[n] && m[n].at).sort((a, b) => m[b].at - m[a].at);
  H.sel = by[0] || SLOTS.find(n => !slot(n).empty) || 1;
}
if (H.go) H.skip[H.go] = false;
render();
if (location.hash === '#saves') setTimeout(() => { const el = $('#saves'); if (el && el.scrollIntoView) el.scrollIntoView(); }, 0);
else if (backFrom) setTimeout(() => { const el = document.querySelector(backFrom === 'drive' && H.sel === 'drive' ? '#detail' : '.hs-test.' + backFrom); if (el && el.scrollIntoView) el.scrollIntoView({ block:'start' }); }, 0);
else if (H.go) setTimeout(() => { const el = document.querySelector(`.hs-unit[data-unit="${H.go}"]`); if (el && el.scrollIntoView) el.scrollIntoView({ block:'center' }); }, 0);
/* tests: the page's state */
window.__home = () => ({ sel:H.sel, naming:H.naming, confirm:H.confirm, nav:H.nav, designer:designerOn(),
  slots:SLOTS.map(n => { const s = slot(n); return { n, empty:s.empty, name:s.name || '', pct:s.g.pct, done:s.g.done, total:s.g.total, unit:s.cur ? s.cur.unit : null, where:whereText(s),
    open:s.open, units:s.g.units.map(u => ({ unit:u.unit, done:u.done, total:u.total, pct:u.pct, finished:u.finished })), when:s.meta ? s.meta.at : null,
    reached:Object.fromEntries(MANIFESTS.map(M => [M.unit, s.open[M.unit] ? PROGRESS.reached(M, s.saves[M.unit]).map(r => r.kind === 'lesson' ? 'l' + r.n : 't:' + r.id) : []])) }; }),
  manifests:MANIFESTS.map(M => ({ unit:M.unit, items:PROGRESS.items(M).length, saveKey:M.saveKey })),
  tests:{ drive:{ shown:!!driveUnits().length, last:driveLast(), items:Object.fromEntries(driveUnits().map(M => [M.unit, driveItems(M).map(x => ({ kind:x.kind, key:x.key, title:x.title, off:x.off || '' }))])) },
    world:{ saved:Object.fromEntries(MANIFESTS.map(M => [M.unit, worldSaved(M)])), reset:H.reset } } });
})();
</script>
</body>
</html>
